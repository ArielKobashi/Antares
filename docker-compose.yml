services:
  postgres:
    image: postgres:16-alpine
    container_name: antares-postgres
    environment:
      POSTGRES_USER: antares
      POSTGRES_PASSWORD: antares
      POSTGRES_DB: antares
    ports:
      - "5432:5432"
    volumes:
      - antares-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U antares -d antares"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  antares-postgres:

